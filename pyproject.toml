[project]
name = "complianceqapipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Faraz Gill", email = "farazgill12@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.10",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.30.2",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.43.0",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.6",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    "uvicorn>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
complianceqapipeline = "complianceqapipeline:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
